name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Type stubs differ between pandas/NumPy versions, so the checkers are pinned.
      - name: Install
        run: pip install -e . pytest==9.1.1 ruff==0.17.2 mypy==2.4.0 pandas-stubs==3.0.5.260914
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest
